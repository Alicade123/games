<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Number Difference</title>
  </head>

  <body>
    <h1>Number Difference</h1>

    <p>
      Previous Number:
      <span id="previousNumber"></span>
    </p>

    <p>
      Current Number:
      <span id="currentNumber"></span>
    </p>

    <input type="number" id="answerInput" placeholder="Enter answer" />

    <button id="submitButton">Submit</button>

    <p id="message"></p>

    <p>
      Score:
      <span id="score">0</span>
    </p>

    <script src="script.js"></script>
  </body>
</html>
