<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Number Difference Game</title>
  </head>

  <body>
    <main>
      <h1>Number Difference Game</h1>

      <!-- Time Selection -->
      <div id="timeSelection">
        <label for="timeLimit"> Choose Time: </label>

        <select id="timeLimit">
          <option value="30">30 Seconds</option>
          <option value="60">60 Seconds</option>
          <option value="120">2 Minutes</option>
          <option value="0">No Time Limit</option>
        </select>
      </div>

      <!-- Start / Restart -->
      <button id="startButton">Start Game</button>

      <!-- Timer -->
      <p>
        Time:
        <span id="timer">--</span>
      </p>

      <!-- Game -->
      <section id="game">
        <div>
          <p>Previous Number</p>
          <span id="previousNumber">-</span>
        </div>

        <div>
          <p>Current Number</p>
          <span id="currentNumber">-</span>
        </div>

        <div>
          <input
            type="number"
            id="answerInput"
            placeholder="Enter difference"
            disabled
          />

          <button id="submitButton" disabled>Submit</button>
        </div>

        <p id="message"></p>

        <p>
          Score:
          <span id="score">0</span>
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
